root = "/workspace"
tmp_dir = "/tmp/air-server"

[build]
  cmd = "go build -C /workspace/server -o /tmp/air-server/app ./cmd/server"
  entrypoint = ["/tmp/air-server/app"]
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["data", ".git", ".worktrees", "tmp", "web"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true
