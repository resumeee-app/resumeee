# Resumeee — Full-Stack Multi-Container Composition
# Builds and launches the unified Go API & MCP server, React Web SPA, and optional local Ollama LLM runtime.
#
# Prerequisite:
#   Run ./scripts/clone-all.sh (or `make clone`) to ensure child repositories are present.
#
# Quickstart:
#   docker compose up -d --build

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      additional_contexts:
        core: ./core
        sql: ./sql
        resumeee-auth-firebase: ./resumeee-auth-firebase
    image: resumeee:latest
    container_name: resumeee-server
    command: ["server"]
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/resumeee.db
      - ADMIN_MODE=${ADMIN_MODE:-true}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-}
      - DEFAULT_USER_ID=${DEFAULT_USER_ID:-default}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
      - LLM_DAILY_REQUEST_LIMIT=${LLM_DAILY_REQUEST_LIMIT:-50}
      - LLM_MONTHLY_TOKEN_LIMIT=${LLM_MONTHLY_TOKEN_LIMIT:-1000000}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - MAX_CONCURRENT_JOBS_PER_TENANT=${MAX_CONCURRENT_JOBS_PER_TENANT:-2}
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REST_TIMEOUT=${REST_TIMEOUT:-20s}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-10m}
      - LLM_DEBUG_PROMPTS=${LLM_DEBUG_PROMPTS:-false}
      - LLM_DEBUG_DIR=${LLM_DEBUG_DIR:-/data/llm}
      # Hosted LLM API Keys (injected from host environment / .env)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # OpenAI-Compatible / Ollama endpoint
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-http://ollama:11434/v1}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-ollama}
    volumes:
      - resumeee-data:/data
    networks:
      - resumeee-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      ollama:
        condition: service_started
        required: false

  web:
    build:
      context: ./resumeee-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        ADMIN_MODE: ${ADMIN_MODE:-true}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
    image: resumeee-web:latest
    container_name: resumeee-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:8080"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - ADMIN_MODE=${ADMIN_MODE:-true}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
    networks:
      - resumeee-net
    depends_on:
      server:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: resumeee-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - resumeee-net
    profiles:
      - local-llm

volumes:
  resumeee-data:
    name: resumeee-data
  ollama-data:
    name: ollama-data

networks:
  resumeee-net:
    name: resumeee-net
    driver: bridge
