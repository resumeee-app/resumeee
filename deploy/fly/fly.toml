# Fly.io deployment manifest template for Resumeee
app = "resumeee"
primary_region = "ord"

[build]
  image = "ghcr.io/resumeee-app/api:latest"

[env]
  PORT = "8080"
  DB_PATH = "/data/resumeee.db"
  ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "resumeee_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
