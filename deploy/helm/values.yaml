# Default values for resumeee helm chart.

replicaCount: 2

image:
  api:
    repository: ghcr.io/resumeee-app/api
    pullPolicy: IfNotPresent
    tag: "latest"
  web:
    repository: ghcr.io/resumeee-app/web
    pullPolicy: IfNotPresent
    tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: resumeee.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi
