# Dev override with live reload across all Go workspace modules (air) and React SPA (Vite HMR).
# Usage:
#   DEV_UID=$(id -u) DEV_GID=$(id -g) docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   or simply: make dev

services:
  server:
    image: resumeee-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
      additional_contexts: !reset {}
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    restart: "no"
    command: ["air", "-c", "/workspace/.air.server.toml"]
    environment:
      - ENV=development
      - LOG_LEVEL=DEBUG
      - GOWORK=/workspace/go.work
    volumes:
      - ./go.work:/workspace/go.work:ro
      - ./.air.server.toml:/workspace/.air.server.toml:ro
      - ./resumeee-core:/workspace/resumeee-core
      - ./resumeee-storage-sql:/workspace/resumeee-storage-sql
      - ./resumeee-auth-firebase:/workspace/resumeee-auth-firebase
      - ./resumeee-api:/workspace/resumeee-api
      - go-mod-cache:/go
      - go-build-cache:/gocache
      - ./data:/data
    healthcheck:
      start_period: 90s

  web:
    build:
      context: ./resumeee-web
      dockerfile: Dockerfile.dev
      args: !reset {}
    image: resumeee-web-dev:latest
    container_name: resumeee-web-dev
    restart: "no"
    ports: !override
      - "${VITE_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_API_PROXY_TARGET=http://server:8080
      - ADMIN_MODE=${ADMIN_MODE:-true}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
    volumes:
      - ./resumeee-web:/app
      - web-node-modules:/app/node_modules
    networks:
      - resumeee-net
    depends_on:
      server:
        condition: service_started

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
